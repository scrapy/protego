[tox]
envlist = py

[testenv]
deps =
    pytest
    pytest-cov >= 7.0.0
    pytest-timeout
commands =
    pytest --cov=protego --cov-report=xml --cov-report= {posargs:tests}

[testenv:benchmarks]
deps =
    pytest
    pytest-codspeed==5.0.3
commands =
    pytest --codspeed {posargs:benchmarks/test_benchmarks.py}

[testenv:comparison]
deps =
    -r benchmarks/requirements.txt
    docutils
    pytest
commands =
    pytest benchmarks/test_comparison.py
    python -m benchmarks.compare {posargs}

[testenv:pre-commit]
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure
skip_install = true

[testenv:twinecheck]
basepython = python3
deps =
    twine==6.2.0
    build==1.4.0
commands =
    python -m build --sdist
    twine check dist/*

[testenv:typing]
basepython = python3
deps =
    mypy==1.19.1
    pytest
    scrapy==2.14.1
commands =
    mypy {posargs: src tests}
