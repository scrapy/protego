[tox]
envlist = py

[testenv]
deps =
    pytest
    pytest-cov >= 7.0.0
    pytest-timeout
commands =
    pytest --cov=protego --cov-report=xml --cov-report= --cov-report=term-missing \
        --junitxml=testenv.junit.xml -o junit_family=legacy \
        {posargs:tests}

[testenv:pre-commit]
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure
skip_install = true

[testenv:twinecheck]
basepython = python3
deps =
    twine==7.0.0
    build==1.5.0
commands =
    python -m build --sdist
    twine check dist/*

[testenv:mypy]
basepython = python3
deps =
    mypy==2.3.1
    pytest==9.1.1
    scrapy==2.18.0
commands =
    mypy {posargs: src tests}
