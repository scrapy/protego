[tox]
envlist = py

[testenv]
deps =
    pytest
    pytest-cov >= 7.0.0
    pytest-timeout
commands =
    pytest --cov=protego --cov-report=xml --cov-report= --cov-report=term-missing \
        --junitxml=testenv.junit.xml -o junit_family=legacy \
        {posargs:tests}

[testenv:benchmarks]
deps =
    pytest
    pytest-codspeed==5.0.3
# The CodSpeed runner drives pytest-codspeed through CODSPEED_* variables, which
# have to reach the command tox runs for any measurement to happen.
passenv =
    *codspeed*
    *ci*
# Hash randomization perturbs dict and set behaviour, which shows up as
# jitter in instruction counts.
set_env =
    PYTHONHASHSEED = 0
commands =
    pytest --codspeed {posargs:benchmarks/test_benchmarks.py}

[testenv:comparison]
deps =
    -r benchmarks/requirements.txt
    docutils
    pytest
commands =
    pytest benchmarks/test_comparison.py
    python -m benchmarks.compare {posargs}

[testenv:pre-commit]
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure
skip_install = true

[testenv:twinecheck]
basepython = python3
deps =
    twine==7.0.0
    build==1.5.0
commands =
    python -m build --sdist
    twine check dist/*

[testenv:mypy]
basepython = python3
deps =
    mypy==2.3.1
    pytest==9.1.1
    scrapy==2.18.0
commands =
    mypy {posargs: src tests}
