version: 2
updates:
- package-ecosystem: pip
  directory: /benchmarks
  schedule:
    interval: monthly
  cooldown:
    default-days: 7

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  groups:
    github-actions:
      patterns:
      - "*"
  cooldown:
    default-days: 7
